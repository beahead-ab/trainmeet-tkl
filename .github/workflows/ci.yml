name: Test TrainMeet TKL

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run build
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile terminal/trainmeet_tkl_terminal.py
      - run: sh -n install.sh scripts/install-raspberry-pi.sh scripts/install-into-trainmeet-server.sh packaging/raspberry-pi/trainmeet-tkl-kiosk packaging/raspberry-pi/trainmeet-tkl-update
